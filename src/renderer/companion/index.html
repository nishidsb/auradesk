<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: blob: aura:; img-src 'self' file: blob: data: aura:; media-src 'self' file: blob: aura:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div id="titleLeft">
        <span id="charName">Aura</span>
        <button id="btnChar" class="tb-btn" title="切换 / 编辑角色">角色</button>
      </div>
      <div id="titleRight">
        <button id="btnPin" class="tb-btn" title="窗口置顶">📌</button>
        <button id="btnMin" class="tb-btn" title="最小化">—</button>
        <button id="btnClose" class="tb-btn" title="关闭">✕</button>
      </div>
    </header>

    <div id="stage">
      <!-- 形象区：立绘 / Spine canvas / three.js VRM 三选一 -->
      <canvas id="vrmCanvas" hidden></canvas>
      <canvas id="spineCanvas" hidden></canvas>
      <img id="stillImg" alt="" hidden>
      <div id="stageFallback" hidden>✦</div>
    </div>

    <!-- 角色抽屉 -->
    <aside id="charDrawer" hidden>
      <div class="cd-head">
        <select id="charSelect"></select>
        <button id="btnCharNew" class="cd-btn">＋</button>
        <button id="btnCharDel" class="cd-btn">删</button>
        <button id="btnCharClose" class="cd-btn">✕</button>
      </div>
      <div class="seg" id="drawerTabs">
        <button data-t="persona" class="on">角色</button>
        <button data-t="visual">形象</button>
        <button data-t="settings">设置</button>
      </div>
      <div id="tabPersona">
        <label>名字 <input id="fName"></label>
        <button id="btnCharSave" class="cd-save">保存角色</button>
      </div>
      <div id="tabVisual" hidden>
        <label>形象
          <div class="seg" id="visMode">
            <button data-m="still" class="on">立绘</button>
            <button data-m="spine">Spine</button>
            <button data-m="vrm">3D</button>
          </div>
          <button id="btnImport" class="cd-btn wide">导入形象文件…</button>
          <div class="hint" id="visHint"></div>
        </label>
        <button id="btnCharSave2" class="cd-save">保存角色</button>
      </div>
      <div id="tabSettings" hidden>
        <label class="cd-check"><input type="checkbox" id="cpPetOn"> 在桌面显示角色（右下角，可拖动）</label>
        <label>角色大小 <span id="cpPetScaleV">1.0×</span>
          <input id="cpPetScale" type="range" min="40" max="200" step="5" value="100">
        </label>
        <label>语音合成（触摸反应语音 / 试听）
          <select id="cpTtsMode">
            <option value="browser">系统语音</option>
            <option value="api">API / 本地引擎</option>
            <option value="off">关闭</option>
          </select>
          <select id="cpTtsProvider">
            <option value="fish">Fish Audio（官方 API）</option>
            <option value="openai">OpenAI 兼容（fish-speech / IndexTTS 等）</option>
            <option value="gptsovits">GPT-SoVITS 本地（端口 9880）</option>
          </select>
          <input id="cpTtsBase" placeholder="TTS 地址（留空复用 API 地址）">
          <input id="cpTtsModel" placeholder="TTS 模型（OpenAI 兼容端点用）">
          <input id="cpTtsKey" type="password" placeholder="TTS Key（留空复用 API Key）">
          <select id="cpTtsVoice" hidden>
            <option value="alloy">alloy（中性）</option>
            <option value="echo">echo（男声）</option>
            <option value="fable">fable（英式叙事）</option>
            <option value="onyx">onyx（低沉男声）</option>
            <option value="nova">nova（活力女声）</option>
            <option value="shimmer">shimmer（柔和女声）</option>
          </select>
          <input id="cpTtsRefAudio" placeholder="GPT-SoVITS：参考音频 wav 路径">
          <input id="cpTtsPromptText" placeholder="GPT-SoVITS：参考音频里说的话">
        </label>
        <label id="cpSysVoiceRow" hidden>朗读音色（系统语音）
          <select id="cpSysVoice"><option value="">自动</option></select>
        </label>
        <div id="cpFish" hidden>
          <label>Fish Audio API Key（专用；留空则用上方 TTS Key / API Key）
            <input id="cpFishKey" type="password" placeholder="fa-xxxxxxxx">
          </label>
          <label>Fish Audio API 端点
            <input id="cpFishBase" placeholder="https://api.fish.audio/v1/tts">
          </label>
          <label>TTS 模型
            <input id="cpFishModel" placeholder="s2.1-pro-free">
          </label>
          <label>Voice model ID / reference_id（Fish 声音库或自建声音模型的 ID）
            <input id="cpFishVoice" placeholder="57c45a3aa7b34a62af8eb27137f092c8">
            <button id="cpFishVoiceFetch" class="cd-btn">获取我的声音列表</button>
            <select id="cpFishVoiceSel" hidden></select>
            <div class="hint" id="cpFishVoiceTip"></div>
          </label>
          <label>ASMR 模式 Voice model ID（留空沿用普通音色）
            <input id="cpFishAsmr" placeholder="2c83af8fceab43748439353dd501be21">
          </label>
          <label>输出格式
            <select id="cpFishFormat">
              <option value="wav">WAV</option>
              <option value="mp3">MP3</option>
            </select>
          </label>
          <label>延迟策略
            <select id="cpFishLatency">
              <option value="normal">质量优先</option>
              <option value="balanced">平衡</option>
            </select>
          </label>
          <label>感情程度（<span id="cpFishFeelingV">0</span>%，Drama 3 情绪增强）
            <input id="cpFishFeeling" type="range" min="0" max="100" value="0">
          </label>
          <label>句内情绪演出密度（<span id="cpFishDensityV">0</span>%，感叹强调/轻语/停顿标签频率）
            <input id="cpFishDensity" type="range" min="0" max="100" value="0">
          </label>
          <label>语速（<span id="cpSpeedV">1.0</span>x，播放速率）
            <input id="cpSpeed" type="range" min="50" max="200" value="100">
          </label>
          <label>语音请求的网络代理（系统代理若是「API 中转」会替换 Key 导致 401 时用这个绕开）
            <input id="cpNetProxy" placeholder="留空=跟随系统 | direct=强制直连 | 如 http://127.0.0.1:7890">
          </label>
          <label>试听文字
            <textarea id="cpFishPreview" rows="2">你好！今天也一起去寻找有趣的炼金素材吧！</textarea>
            <button id="cpPreviewBtn" class="cd-btn wide">▶ 试听（用当前档位）</button>
            <div class="hint" id="cpPreviewTip"></div>
          </label>
        </div>
        <label>数据管理（语音 Key、角色卡全部只保存在本机，不上传任何服务器；备份文件含明文 Key，请妥善保管）
          <button id="cpExportBtn" class="cd-btn">导出全部设置到文件</button>
          <button id="cpImportBtn" class="cd-btn">从备份文件导入（导入后自动重启）</button>
          <div class="hint" id="cpDataTip"></div>
        </label>
        <button id="cpSave" class="cd-save">保存设置</button>
        <div class="hint" id="cpSaveTip"></div>
      </div>
    </aside>
  </div>
  <script src="libs.js"></script>
  <script src="app.js"></script>
</body>
</html>
