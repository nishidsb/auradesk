<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: blob: aura:; img-src 'self' file: blob: data: aura:; media-src 'self' file: blob: aura:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div id="titleLeft">
        <span id="charName">Aura</span>
        <button id="btnChar" class="tb-btn" title="切换 / 编辑角色">角色</button>
      </div>
      <div id="titleRight">
        <button id="btnMic" class="tb-btn" title="按住说话">🎙</button>
        <button id="btnClear" class="tb-btn" title="清空对话">🧹</button>
        <button id="btnPin" class="tb-btn" title="窗口置顶">📌</button>
        <button id="btnMin" class="tb-btn" title="最小化">—</button>
        <button id="btnClose" class="tb-btn" title="关闭">✕</button>
      </div>
    </header>

    <div id="stage">
      <!-- 形象区：立绘 / Spine canvas / three.js VRM 三选一 -->
      <canvas id="vrmCanvas" hidden></canvas>
      <canvas id="spineCanvas" hidden></canvas>
      <img id="stillImg" alt="" hidden>
      <div id="stageFallback" hidden>✦</div>
    </div>

    <div id="chat"></div>

    <footer id="inputbar">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="btnSend" title="发送">➤</button>
      <button id="btnStop" title="停止生成" hidden>■</button>
    </footer>

    <!-- 角色抽屉 -->
    <aside id="charDrawer" hidden>
      <div class="cd-head">
        <select id="charSelect"></select>
        <button id="btnCharNew" class="cd-btn">＋</button>
        <button id="btnCharDel" class="cd-btn">删</button>
        <button id="btnCharClose" class="cd-btn">✕</button>
      </div>
      <div class="seg" id="drawerTabs">
        <button data-t="persona" class="on">人设</button>
        <button data-t="visual">形象</button>
        <button data-t="settings">设置</button>
      </div>
      <div id="tabPersona">
        <label>名字 <input id="fName"></label>
        <label>人设（性格 / 说话风格 / 与你的关系，随便写）
          <textarea id="fPersona" rows="6"></textarea>
        </label>
        <label>世界书条目（关键词命中才注入）
          <div id="worldList"></div>
          <button id="btnWorldAdd" class="cd-btn">＋ 加一条世界观</button>
        </label>
        <label>长期记忆（AI 自动记下的关于你的事，点 ✕ 可删）
          <div id="memList" class="mem-list"></div>
        </label>
        <button id="btnCharSave" class="cd-save">保存角色</button>
      </div>
      <div id="tabVisual" hidden>
        <label>形象
          <div class="seg" id="visMode">
            <button data-m="still" class="on">立绘</button>
            <button data-m="spine">Spine</button>
            <button data-m="vrm">3D</button>
          </div>
          <button id="btnImport" class="cd-btn wide">导入形象文件…</button>
          <div class="hint" id="visHint"></div>
        </label>
        <button id="btnCharSave2" class="cd-save">保存角色</button>
      </div>
      <div id="tabSettings" hidden>
        <label>API 地址（OpenAI 兼容；本地 Ollama 填 http://127.0.0.1:11434/v1）
          <input id="cpApiBase" placeholder="https://api.example.com/v1">
        </label>
        <label>API Key（本地模型一般留空）
          <input id="cpApiKey" type="password" placeholder="sk-…">
        </label>
        <label>模型
          <div style="display:flex;gap:6px">
            <input id="cpApiModel" placeholder="gpt-4o-mini / qwen2.5:7b" style="flex:1">
            <button id="cpFetchModels" class="cd-btn">获取模型列表</button>
          </div>
        </label>
        <label class="cd-check"><input type="checkbox" id="cpVision"> 允许 AI 截屏看桌面（需支持视觉的模型）</label>
        <label class="cd-check"><input type="checkbox" id="cpPetOn"> 在桌面显示角色（右下角，可拖动）</label>
        <label>AI 回复语言（外语提问按此语言回复＝翻译）
          <select id="cpReplyLang">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>
        <label>语音合成（朗读回复）
          <select id="cpTtsMode">
            <option value="browser">系统语音</option>
            <option value="api">API / 本地引擎</option>
            <option value="off">关闭</option>
          </select>
          <select id="cpTtsProvider">
            <option value="openai">OpenAI 兼容（Fish Audio 云 / fish-speech / IndexTTS）</option>
            <option value="gptsovits">GPT-SoVITS 本地（端口 9880）</option>
          </select>
          <input id="cpTtsBase" placeholder="TTS 地址（留空复用 API 地址）">
          <input id="cpTtsModel" placeholder="TTS 模型（Fish Audio 填 s1）">
          <input id="cpTtsKey" type="password" placeholder="TTS Key（留空复用 API Key）">
          <input id="cpTtsRefAudio" placeholder="GPT-SoVITS：参考音频 wav 路径">
          <input id="cpTtsPromptText" placeholder="GPT-SoVITS：参考音频里说的话">
        </label>
        <label>语音识别（按住 🎙 说话；Whisper 兼容端点）
          <input id="cpAsrBase" placeholder="识别端点，如 https://api.groq.com/openai/v1">
          <input id="cpAsrModel" placeholder="whisper-large-v3 / whisper-1">
          <input id="cpAsrKey" type="password" placeholder="ASR Key（留空复用 API Key）">
          <select id="cpAsrLang">
            <option value="auto">识别语言：自动（中/英/日）</option>
            <option value="zh">识别语言：中文</option>
            <option value="en">识别语言：英文</option>
            <option value="ja">识别语言：日文</option>
          </select>
        </label>
        <button id="cpSave" class="cd-save">保存设置</button>
        <div class="hint" id="cpSaveTip"></div>
      </div>
    </aside>
  </div>
  <script src="libs.js"></script>
  <script src="app.js"></script>
</body>
</html>
